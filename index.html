<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کازینو آنلاین</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ==================== -->
        <!-- صفحه اصلی (لابی)      -->
        <!-- ==================== -->
        <div id="lobbyPage">
            <!-- هدر با اطلاعات کاربر -->
            <div id="header">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">👤</div>
                    <div class="user-details">
                        <h1 id="welcomeMessage">کاربر مهمان</h1>
                        <span id="userUsername">@username</span>
                    </div>
                </div>
                <div class="balance-box">
                    <span>💰 موجودی:</span>
                    <span id="balanceDisplay">۱۰,۰۰۰</span> تومان
                </div>
                <button id="addMoneyBtn" class="add-money-btn">➕ افزایش موجودی</button>
            </div>

            <!-- لیست بازی‌ها -->
            <div id="gamesList">
                <h2>🎮 بازی‌ها</h2>
                <div class="games-grid">
                    <!-- بازی انفجار - استفاده از onclick مستقیم -->
                    <div class="game-card" onclick="goToGame()">
                        <div class="game-icon">💥</div>
                        <div class="game-name">انفجار</div>
                        <div class="game-desc">ضریب بالا برو و قبل از سقوط برداشت کن!</div>
                        <button class="play-btn" onclick="event.stopPropagation(); goToGame();">▶ بازی</button>
                    </div>
                </div>
            </div>

            <!-- تاریخچه کلی -->
            <div id="history">
                <h3>📋 تاریخچه بازی‌ها:</h3>
                <ul id="historyList"></ul>
            </div>
        </div>

        <!-- ==================== -->
        <!-- صفحه بازی انفجار      -->
        <!-- ==================== -->
        <div id="gamePage" style="display:none;">
            <!-- دکمه بازگشت -->
            <button id="backToLobbyBtn" class="back-btn" onclick="goToLobby()">← بازگشت</button>

            <!-- هدر بازی -->
            <div id="gameHeader">
                <h2>💥 انفجار</h2>
                <div class="balance-box">
                    <span>💰 موجودی:</span>
                    <span id="gameBalanceDisplay">۱۰,۰۰۰</span> تومان
                </div>
            </div>

            <!-- نمایش ضریب -->
            <div id="multiplierDisplay">
                <span id="multiplierValue">1.00</span>
                <span id="multiplierUnit">x</span>
            </div>

            <!-- وضعیت بازی -->
            <p id="gameStatus">⏳ منتظر شروع راند بعدی...</p>
            <p id="countdownDisplay" style="font-size:24px; font-weight:bold; color:#ffd93d;"></p>

            <!-- نمودار -->
            <div id="chartContainer">
                <canvas id="chartCanvas" width="400" height="200"></canvas>
            </div>

            <!-- بخش شرط‌بندی -->
            <div class="bet-box">
                <label>💰 مبلغ شرط (تومان):</label>
                <input type="number" id="betInput" value="100" min="100" step="100">
                
                <div class="quick-bet-buttons">
                    <button class="quick-bet" data-amount="100">۱۰۰</button>
                    <button class="quick-bet" data-amount="500">۵۰۰</button>
                    <button class="quick-bet" data-amount="1000">۱۰۰۰</button>
                    <button class="quick-bet" data-amount="5000">۵۰۰۰</button>
                </div>
            </div>

            <button id="betButton">🚀 شرط ببند!</button>
            <button id="cashOutButton" style="display:none;">💰 برداشت</button>
            
            <p id="resultMessage"></p>

            <!-- لیست بازیکنان -->
            <div id="playersContainer">
                <h3>👥 بازیکنان آنلاین:</h3>
                <ul id="playersList"></ul>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // توابع سراسری برای onclick
        // ==========================================
        function goToGame() {
            document.getElementById('lobbyPage').style.display = 'none';
            document.getElementById('gamePage').style.display = 'block';
            // شروع بازی با تاخیر
            setTimeout(() => {
                if (typeof startGameFromLobby === 'function') {
                    startGameFromLobby();
                }
            }, 300);
        }

        function goToLobby() {
            document.getElementById('lobbyPage').style.display = 'block';
            document.getElementById('gamePage').style.display = 'none';
            // توقف بازی
            if (typeof stopGame === 'function') {
                stopGame();
            }
        }
    </script>

    <script src="app.js"></script>
</body>
</html>
