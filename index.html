<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 Aviator Crash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

    <!-- ===== LOBBY ===== -->
    <div id="lobby">
        <div class="header">
            <div class="user-info">
                <div class="avatar" id="lobbyAvatar">👤</div>
                <div>
                    <div class="name" id="lobbyName">Guest</div>
                    <div class="username" id="lobbyUsername">@username</div>
                </div>
            </div>
            <div class="balance-box">
                <span class="bal-label">💰 Balance</span>
                <span class="bal-amount" id="lobbyBalance">$1,000</span>
            </div>
        </div>

        <button class="deposit-btn" id="depositBtn">⚡ Deposit with TON</button>

        <div class="game-card" onclick="goToGame()">
            <div class="game-icon">🚀</div>
            <div class="game-title">Aviator Crash</div>
            <div class="game-desc">Place your bet, watch the rocket take off!</div>
            <button class="play-btn">▶ Play Now</button>
        </div>

        <div class="history-section">
            <div class="section-title">📋 History</div>
            <div id="historyList"></div>
        </div>
    </div>

    <!-- ===== GAME ===== -->
    <div id="game" class="hidden">
        <button class="back-btn" onclick="goToLobby()">← Back</button>

        <div class="game-header">
            <h2>🚀 Aviator</h2>
            <div class="balance-box small">
                <span class="bal-label">💰</span>
                <span class="bal-amount" id="gameBalance">$1,000</span>
            </div>
        </div>

        <!-- MULTIPLIER -->
        <div class="multiplier-display">
            <div class="multiplier" id="multiplierDisplay">1.00<span class="unit">x</span></div>
            <div class="status" id="gameStatus">⏳ Waiting...</div>
            <div class="countdown" id="countdownDisplay"></div>
        </div>

        <!-- CHART -->
        <div class="chart-container">
            <canvas id="chartCanvas" width="380" height="200"></canvas>
        </div>

        <!-- CRASH HISTORY -->
        <div class="crash-history-bar">
            <span class="crash-label">📊 Recent:</span>
            <span id="crashHistoryList"></span>
        </div>

        <!-- ===== BETTING SECTION ===== -->
        <div class="betting-section">

            <!-- AUTO BET -->
            <div class="auto-bet-row">
                <span class="auto-label">🤖 Auto Bet</span>
                <input type="number" id="autoBetInput" placeholder="2.00" value="2.00" step="0.01" min="1.01">
                <button class="auto-btn" id="autoBetBtn">▶ Start</button>
            </div>

            <!-- BET INPUT -->
            <div class="bet-input-row">
                <input type="number" id="betInput" placeholder="0.1" value="0.1" step="0.1" min="0.1">
            </div>
            <div class="quick-bets">
                <button data-amount="0.1">$0.1</button>
                <button data-amount="1">$1</button>
                <button data-amount="5">$5</button>
                <button data-amount="10">$10</button>
                <button data-amount="50">$50</button>
                <button data-amount="100">$100</button>
                <button data-amount="1000">$1000</button>
            </div>

            <!-- ===== MAIN BUTTONS ===== -->
            <button class="btn-main btn-bet" id="betBtn">🚀 Place Bet</button>
            <button class="btn-main btn-cancel" id="cancelBtn">🔄 Cancel Bet</button>
            <button class="btn-main btn-cash" id="cashBtn">💰 Cash Out</button>

        </div>

        <div class="result" id="result"></div>

        <!-- STATS -->
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-value" id="totalBets">0</div>
                <div class="stat-label">Total Bets</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="totalWins">$0</div>
                <div class="stat-label">Total Wins</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="totalBetAmount">$0</div>
                <div class="stat-label">Total Bet</div>
            </div>
        </div>

        <!-- HISTORY -->
        <div class="history-section" id="historySection">
            <div id="historyList"></div>
        </div>
    </div>

    <!-- ===== DEPOSIT MODAL ===== -->
    <div id="depositModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚡ Deposit with TON</h2>
                <button class="modal-close" onclick="closeDepositModal()">✕</button>
            </div>
            <div class="modal-body">
                <p class="modal-desc">Select amount to deposit using TON</p>
                <div class="ton-amounts">
                    <button class="ton-amount" data-amount="10">10 TON</button>
                    <button class="ton-amount" data-amount="25">25 TON</button>
                    <button class="ton-amount" data-amount="50">50 TON</button>
                    <button class="ton-amount" data-amount="100">100 TON</button>
                    <button class="ton-amount" data-amount="250">250 TON</button>
                    <button class="ton-amount" data-amount="500">500 TON</button>
                </div>
                <div class="custom-amount">
                    <input type="number" id="customTonAmount" placeholder="Custom amount (TON)">
                    <button class="btn-deposit-custom" onclick="depositCustomTon()">Deposit</button>
                </div>
                <div class="exchange-rate">💎 1 TON = $1.25</div>
                <button class="btn-deposit-confirm" onclick="confirmDeposit()">Confirm Deposit</button>
            </div>
        </div>
    </div>

</div>

<script>
function goToGame() {
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    if (typeof startGameFromLobby === 'function') startGameFromLobby();
}

function goToLobby() {
    document.getElementById('lobby').classList.remove('hidden');
    document.getElementById('game').classList.add('hidden');
    if (typeof stopGame === 'function') stopGame();
}

function openDepositModal() {
    document.getElementById('depositModal').classList.remove('hidden');
}

function closeDepositModal() {
    document.getElementById('depositModal').classList.add('hidden');
}

function depositCustomTon() {
    const input = document.getElementById('customTonAmount');
    const amount = parseInt(input.value);
    if (amount && amount > 0) {
        if (typeof depositTon === 'function') depositTon(amount);
        input.value = '';
        closeDepositModal();
    }
}

function confirmDeposit() {
    alert('✅ Deposit successful!');
    closeDepositModal();
}
</script>

<script src="app.js"></script>
</body>
</html>
