<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="avatar" id="lobbyAvatar">👤</div>
            <div>
                <div class="name" id="lobbyName">Guest</div>
                <div class="username" id="lobbyUsername">@username</div>
            </div>
        </div>
        <div class="balance-header">
            <span class="bal-label">💰 Balance</span>
            <span class="bal-amount" id="balanceDisplay">$1,000</span>
        </div>
    </div>

    <!-- T&C -->
    <div class="tc">📜 T&C - Play responsibly</div>

    <!-- MULTIPLIER -->
    <div class="multiplier-display">
        <div class="multiplier" id="multiplierDisplay">1.00<span class="unit">x</span></div>
        <div class="status" id="gameStatus">⏳ Waiting for next round...</div>
        <div class="countdown" id="countdownDisplay"></div>
    </div>

    <!-- SPEEDOMETER WITH PLANE -->
    <div class="speedometer-container">
        <canvas id="speedometerCanvas" width="380" height="180"></canvas>
    </div>

    <!-- AUTO BET -->
    <div class="auto-bet-section">
        <div class="auto-bet-row">
            <label>🤖 Auto Bet</label>
            <input type="number" id="autoBetInput" placeholder="2.00" value="2.00" step="0.01" min="1.01">
            <button class="auto-btn" id="autoBetBtn">▶ Start</button>
        </div>
        <div class="quick-bets">
            <button data-amount="100">$100</button>
            <button data-amount="500">$500</button>
            <button data-amount="1000">$1K</button>
            <button data-amount="5000">$5K</button>
            <button data-amount="10000">$10K</button>
            <button data-amount="50000">$50K</button>
        </div>
    </div>

    <!-- BET BUTTON -->
    <button class="bet-btn-main" id="betBtn">🚀 Place Bet</button>

    <!-- STATS -->
    <div class="stats-row">
        <div class="stat-box">
            <div class="stat-value" id="totalBets">0</div>
            <div class="stat-label">Total Bets</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="totalWins">$0</div>
            <div class="stat-label">Total Wins</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="totalBetAmount">$0</div>
            <div class="stat-label">Total Bet</div>
        </div>
    </div>

    <!-- HISTORY -->
    <div class="history-section" id="historySection">
        <div id="historyList"></div>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
