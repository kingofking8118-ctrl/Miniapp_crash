<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی انفجار</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1 id="welcomeMessage">🔥 بازی انفجار</h1>
        
        <div id="multiplierDisplay">
            <span id="multiplierValue">1.00</span>
            <span id="multiplierUnit">x</span>
        </div>

        <p id="gameStatus">⏳ منتظر شروع دور بعدی...</p>

        <div class="bet-box">
            <label>💰 مبلغ شرط (تومان):</label>
            <input type="number" id="betInput" value="100" min="100" step="100">
            
            <div class="quick-bet-buttons">
                <button class="quick-bet" data-amount="100">۱۰۰</button>
                <button class="quick-bet" data-amount="500">۵۰۰</button>
                <button class="quick-bet" data-amount="1000">۱۰۰۰</button>
            </div>
        </div>

        <button id="betButton">🚀 شرط ببند!</button>
        
        <p id="resultMessage"></p>

        <div id="history">
            <h3>📋 تاریخچه:</h3>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
