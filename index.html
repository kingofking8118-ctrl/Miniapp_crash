<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💥 Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ==================== -->
        <!-- LOBBY PAGE -->
        <!-- ==================== -->
        <div id="lobbyPage">
            <div id="header">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">👤</div>
                    <div class="user-details">
                        <h1 id="welcomeMessage">Guest</h1>
                        <span id="userUsername">@username</span>
                    </div>
                </div>
                <div class="balance-box">
                    <span>💰 Balance</span>
                    <span id="balanceDisplay">$1,000</span>
                </div>
                <button id="addMoneyBtn" class="add-money-btn">➕ Add Funds</button>
            </div>

            <div id="gamesList">
                <h2>🎮 Games</h2>
                <div class="games-grid">
                    <div class="game-card" onclick="goToGame()">
                        <div class="game-icon">💥</div>
                        <div class="game-name">Crash</div>
                        <div class="game-desc">Watch multiplier climb and cash out before it crashes!</div>
                        <button class="play-btn" onclick="event.stopPropagation(); goToGame();">▶ Play</button>
                    </div>
                </div>
            </div>

            <div id="history">
                <h3>📋 History</h3>
                <ul id="historyList"></ul>
            </div>
        </div>

        <!-- ==================== -->
        <!-- GAME PAGE -->
        <!-- ==================== -->
        <div id="gamePage" style="display:none;">
            <button id="backToLobbyBtn" class="back-btn" onclick="goToLobby()">← Back</button>

            <div id="gameHeader">
                <h2>💥 Crash</h2>
                <div class="balance-box small">
                    <span>💰 Balance</span>
                    <span id="gameBalanceDisplay">$1,000</span>
                </div>
            </div>

            <div id="multiplierDisplay">
                <span id="multiplierValue">1.00</span>
                <span id="multiplierUnit">x</span>
            </div>

            <p id="gameStatus">⏳ Waiting for next round...</p>
            <div id="countdownContainer">
                <span id="countdownDisplay"></span>
            </div>

            <div id="chartContainer">
                <canvas id="chartCanvas" width="400" height="200"></canvas>
            </div>

            <div class="bet-box">
                <label>💰 Bet Amount ($)</label>
                <input type="number" id="betInput" value="10" min="1" step="1">
                
                <div class="quick-bet-buttons">
                    <button class="quick-bet" data-amount="10">$10</button>
                    <button class="quick-bet" data-amount="50">$50</button>
                    <button class="quick-bet" data-amount="100">$100</button>
                    <button class="quick-bet" data-amount="500">$500</button>
                </div>
            </div>

            <button id="betButton">🚀 Place Bet</button>
            <button id="cashOutButton" style="display:none;">💰 Cash Out</button>
            
            <p id="resultMessage"></p>

            <div id="playersContainer">
                <h3>👥 Players</h3>
                <ul id="playersList"></ul>
            </div>
        </div>
    </div>

    <script>
        function goToGame() {
            document.getElementById('lobbyPage').style.display = 'none';
            document.getElementById('gamePage').style.display = 'block';
            setTimeout(() => {
                if (typeof startGameFromLobby === 'function') {
                    startGameFromLobby();
                }
            }, 300);
        }

        function goToLobby() {
            document.getElementById('lobbyPage').style.display = 'block';
            document.getElementById('gamePage').style.display = 'none';
            if (typeof stopGame === 'function') {
                stopGame();
            }
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
